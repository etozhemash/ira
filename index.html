<!doctype html>
<html lang="ru"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Mono&display=swap">
<style>
/* Arcade cabinet: one 3:4 pixel screen, HUD above, control deck below, letter unfolds under it at the end */
:root{
  --bg:#1a1226; --panel:#2a1d3a; --ink:#f6ecff; --muted:#c4b2d8;
  --ginger:#c6a0f4; --pink:#ff7eb6; --mint:#c2e44a; --line:#46335e; --shadow:#5e3f8e;
  --display:"Press Start 2P","Courier New",monospace;
  --body:"PT Mono","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
/* no double-tap zoom on phones */
html,body,button,.stage,.deck{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
#app{width:min(100%,max(270px,calc((100dvh - 210px)*.75)));margin:0 auto;display:flex;flex-direction:column;gap:10px;-webkit-user-select:none;user-select:none}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:10px;letter-spacing:.06em}
#status{color:var(--pink);white-space:nowrap}
#task{margin:0;min-height:3em;font-size:14px;color:var(--muted);text-wrap:balance}
.prog{height:8px;background:var(--line);margin-top:6px}
.prog i{display:block;height:100%;background:var(--mint);width:0}
.meter{position:relative;display:grid;margin-top:6px;height:26px;font-family:var(--display);font-size:8px;line-height:26px;text-align:center;border:3px solid var(--line)}
.withmeter #app{width:min(100%,max(270px,calc((100dvh - 250px)*.75)))}
.meter span{overflow:hidden;white-space:nowrap}
.meter .raw{background:linear-gradient(90deg,#f8f2de,#f2dc9c);color:#6a5a3a}
.meter .ok{background:#e2a64a;color:#3a2410;box-shadow:inset 0 0 0 2px #fff6a0}
.meter .burnt{background:linear-gradient(90deg,#c07a30,#24160f);color:#fff}
.meter i{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 2px #1a1226;left:0}
.stage{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;border:4px solid var(--line);background:#000;box-sizing:border-box;overflow:hidden}
canvas#cv{position:relative;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
#bigtitle{position:absolute;left:0;right:0;top:0;padding:14px 10px;margin:0;background:linear-gradient(rgba(20,12,30,.9) 70%,rgba(20,12,30,0));text-align:center;font-family:var(--display);font-size:clamp(14px,5vw,22px);line-height:1.5;color:var(--ink);
  text-shadow:3px 3px 0 var(--pink),-1px -1px 0 #000;pointer-events:none;text-wrap:balance}
#bigtitle small{display:block;font-size:9px;margin-top:10px;text-shadow:2px 2px 0 #000;color:var(--ink)}
.toast{position:absolute;left:8px;right:8px;bottom:10px;background:var(--ink);color:var(--bg);font-family:var(--body);font-size:14px;padding:8px 10px;border:3px solid var(--bg);text-align:center;pointer-events:none}
.deck{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.deck.one{grid-template-columns:1fr}
.deck.three{grid-template-columns:repeat(3,1fr)}
button.px{font-family:var(--display);font-size:10px;line-height:1.4;color:var(--bg);background:var(--ginger);border:0;padding:12px 8px;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 4px 0 var(--shadow);cursor:pointer;margin-bottom:4px}
button.px:active{transform:translateY(3px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 1px 0 var(--shadow)}
button.px:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button.px:disabled{opacity:.45;cursor:default}
button.px.ok{background:var(--mint);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),0 4px 0 #5f7a1a}
button.px.no{background:var(--pink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),0 4px 0 #9a3a66}
button.px.big{font-size:18px;padding:14px}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(18,10,28,.92);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 #000;padding:16px;max-height:100%;width:100%;max-width:420px;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card .kicker{margin:0;font-family:var(--display);font-size:8px;color:var(--mint);letter-spacing:.08em}
.card h2{margin:0;font-family:var(--display);font-size:12px;line-height:1.6;color:var(--ginger);text-wrap:balance}
.card>*{flex-shrink:0}
.card .wish{margin:0;font-size:16px;line-height:1.45;color:#fff;min-height:1.5em}
.card canvas.ph{width:100%;max-width:190px;align-self:center;image-rendering:pixelated;background:#fff;border:6px solid #fff;border-bottom-width:22px;box-shadow:3px 3px 0 #000;transform:rotate(-2deg)}
#letter{display:flex;flex-direction:column;gap:14px;padding-block:8px 30px;-webkit-user-select:text;user-select:text}
#letter h3{margin:0;font-family:var(--display);font-size:11px;color:var(--ginger);letter-spacing:.06em}
#letter p{margin:0}
#letter ol,#letter ul{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
#letter b{color:var(--mint);font-weight:normal}
@media (prefers-reduced-motion:reduce){button.px:active{transform:none}}
</style>

</head><body>
<div id="app">
  <div class="hud"><span id="lvl">ИРИН КВЕСТ</span><span id="status"></span></div>
  <div id="taskwrap"><p id="task"></p><div class="prog" id="prog" hidden><i></i></div>
    <div class="meter" id="meter" hidden><span class="raw">сырой</span><span class="ok">идеально</span><span class="burnt">горелый</span><i id="mark"></i></div></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <h1 id="bigtitle" hidden></h1>
    <div class="toast" id="toast" hidden></div>
    <div class="overlay" id="ov" hidden><div class="card" id="card" role="dialog" aria-live="polite"></div></div>
  </div>
  <div class="deck" id="deck"></div>
  <section id="letter" hidden>
    <h3>ПОЖЕЛАНИЯ</h3>
    <ol id="wishlist"></ol>
    <h3>ОТ ДРУЗЕЙ</h3>
    <ul id="friendlist"></ul>
    <p id="finaltext"></p>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const W=180,H=240;
const cv=$('#cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

const WISHES=[
  'Пусть мир любит тебя так же сильно, как ты любишь его. А дома всегда будет спокойно и уютно, и там тебя всегда будет ждать кто-то тёплый и родной.',
  'Пусть каждое утро будет офигенным: с запахом блинчиков, любимым человеком рядом и сгущёнкой без ограничений. И пусть комом будет только первый блин и ничего больше.',
  'Пусть в жизни всё будет как в лучшей катке: своя пати рядом, ульта вовремя и победа в конце. А все, кто воняет, пьёт кровь и затягивает в чёрную дыру, пусть обходят тебя стороной.',
  'Пусть судьба всегда приводит тебя туда, где хорошо, пробки рассасываются, ракеты и пожары облетают стороной, а по дороге попадаются подарки, цветы и приятные сюрпризы.',
  'Вот бы всегда так везло! Пусть Stone Island находится за копейки, свитер сидит идеально, а в жизни попадаются только вещи, люди и события с пометкой «класс».',
  'Пусть рядом всегда будут люди, с которыми хочется гулять до заката и после. И пусть 10 000 шагов даются легко, особенно когда они к друзьям.',
  'Пусть в этом году будет столько счастливых кадров, что не хватит никаких картриджей для инстакса. И чтобы на каждом все были рядом.'
];
/* friends' wishes: edit the text freely */
const FRIENDS=[
  {keys:['masha','deni'],names:'Маша и Дени',to:'Машу и Дени',text:'Ира, с днём рождения! Пусть этот год будет таким же тёплым, как закат на набережной, и таким же смешным, как наши посиделки. Любим тебя!'},
  {keys:['pasha'],names:'Паша',to:'Пашу',text:'С днюхой! Желаю, чтобы всё получалось легко, а поводов для блестящих вечеринок в серебристых очках было побольше.'},
  {keys:['danil','lyuba'],names:'Данил и Люба',to:'Данила и Любу',text:'Ира, пусть рядом всегда будут люди, с которыми хоть в подсолнухи, хоть в аэропорт. С днём рождения!'},
  {keys:['vlad','vika','baby'],names:'Влад, Вика и малыш',to:'Влада, Вику и малыша',text:'С днём рождения! Желаем здоровья, уюта, много-много счастья и смеха до слёз, как у нашего малыша.'},
  {keys:['liza'],names:'Лиза, тренер',to:'Лизу',text:'Ира, с днём рождения! Желаю сил, лёгкости и чтобы каждая тренировка была в кайф. Ты большая молодец, я тобой горжусь!'}
];
const FINAL='Ира, оставайся такой же солнечной, смешной и настоящей. Пусть этот год будет тёплым, как свитер из секонда, сладким, как блинчики со сгущёнкой, и ярким, как закат на набережной. С днём рождения!';

/* ---------- pixel helpers ---------- */
function R(x,y,w,h,c,g=ctx){g.fillStyle=c;g.fillRect(x,y,w,h);}
function shapes(g,list,outline){
  if(outline){g.fillStyle=outline;for(const s of list)g.fillRect(s[0]-1,s[1]-1,s[2]+2,s[3]+2);}
  for(const s of list){g.fillStyle=s[4];g.fillRect(s[0],s[1],s[2],s[3]);}
}
function heart(g,x,y,c='#ff7eb6',s=1){
  x=Math.round(x);y=Math.round(y);
  [[1,0,1],[3,0,1],[0,1,5],[1,2,3],[2,3,1]].forEach(([dx,dy,w])=>R(x+dx*s,y+dy*s,w*s,s,c,g));
}
function sparkle(g,x,y,c='#fff6a0',s=1){x=Math.round(x);y=Math.round(y);R(x,y-2*s,s,5*s,c,g);R(x-2*s,y,5*s,s,c,g);}
function ell(g,cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));R(Math.round(cx-w),Math.round(cy+y),w*2+1,1,c,g);}}
function makeSprite(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g);return c;}
function stars(g,w,h,t,n=14){for(let i=0;i<n;i++){const x=(i*53)%w,y=(i*37)%h;R(x,y,1,1,Math.sin(t*3+i)>0?'#fff':'#7d6a9a',g);}}
function lerpC(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('');}
const GL={'Г':['111','100','100','100','100'],'А':['010','101','111','101','101'],'Р':['110','101','110','100','100'],'Ж':['10101','10101','01110','10101','10101'],'Б':['111','100','110','101','110'],
  'С':['111','100','100','100','111'],'Е':['111','100','110','100','111'],'К':['101','101','110','101','101'],'О':['111','101','101','101','111'],'Н':['101','101','111','101','101'],
  'Д':['01110','01010','01010','11111','10001'],'Х':['101','101','010','101','101'],'И':['1001','1001','1011','1101','1001'],'Т':['111','010','010','010','010'],'Ф':['010','111','101','111','010'],' ':['0','0','0','0','0']};
function textW(txt,s=1){let w=0;for(const ch of txt)w+=GL[ch][0].length+1;return(w-1)*s;}
function pixText(g,txt,x,y,c,s=1){for(const ch of txt){const gl=GL[ch];gl.forEach((row,r)=>[...row].forEach((v,i)=>v==='1'&&R(x+i*s,y+r*s,s,s,c,g)));x+=(gl[0].length+1)*s;}}

const K='#1a0c16',OL='#120a14';
const SB=document.createElement('canvas');SB.width=100;SB.height=80;const SG=SB.getContext('2d');
function blit(g,x,y,s,fn){SG.clearRect(0,0,100,80);fn(SG,50,70);g.imageSmoothingEnabled=false;g.drawImage(SB,Math.round(x-50*s),Math.round(y-70*s),Math.round(100*s),Math.round(80*s));}

/* Barney, drawn on the same chunky pixel grid as the people: a plain grey loaf, thick outline,
   big yellow eyes, pink cheeks and a :3 mouth (Pusheen-style) */
function triEar(x,y,dir,c){const r=[];for(let i=0;i<6;i++){const w=6-i;r.push([dir<0?x:x+i,y-i,w,1,c]);}return r;}
const BAR={B:'#8e909c',D:'#6e707c',PK:'#f07898',EY:'#e0a830'};
function catEyes(g,x,y,o,lk){
  const {EY}=BAR;
  if(o.happy){shapes(g,[[x,y+2,1,1,K],[x+1,y+1,2,1,K],[x+3,y+2,1,1,K]]);return;}
  if(o.blink||o.headDown){shapes(g,[[x,y+2,4,1,K]]);return;}
  const px=x+1+Math.max(-1,Math.min(1,lk||0));
  shapes(g,[[x,y,4,4,EY],[px,y+1,2,3,K],[x,y,2,1,'#ffffff'],[x,y+1,1,1,'#ffffff']]);
}
function catMouth(g,cx,y,o){
  shapes(g,[[cx-2,y,1,1,K],[cx-1,y+1,1,1,K],[cx,y,1,1,K],[cx+1,y+1,1,1,K],[cx+2,y,1,1,K]]);
  if(o.happy)R(cx,y+1,1,1,'#f08aa0',g);
}
/* lying loaf for the desk: head on the left, tail up on the right */
function drawBarneyLie(g,x,y,s,o){blit(g,x,y,s,(b,bx,by)=>drawBarneyLieRaw(b,bx,by,o));}
function drawBarneyLieRaw(g,x,y,o){
  g.save();g.translate(x,y);
  const {B,D,PK}=BAR,t=o.t||0,br=Math.sin(t*2.2)>0?1:0,tw=Math.round(Math.sin(t*(o.purr?9:2.4))),ear=(t%5)<.18?1:0,hy=o.headDown?1:0,lk=Math.max(-1,Math.min(1,Math.round(o.look||0)));
  const body=[[-13,-21+ear+hy,3,4,B],[-2,-21+hy,3,4,B],[-14,-18+hy,16,4,B],[-15,-14,24,4,B],[-15,-11-br,30,9+br,B],[-14,-2,28,2,B],
    [-12,0,3,2,B],[-6,0,3,2,B],[3,0,3,2,B],[9,0,3,2,B],[15,-9,2,3,B],[16+tw,-14,3,5,B]];
  if(o.paw==='left')body.push([-20,-3,6,3,B]);
  shapes(g,body,K);
  shapes(g,[[-12,-20+ear+hy,1,2,PK],[-1,-20+hy,1,2,PK],[-14,-3,28,1,D]]);
  catEyes(g,-12+lk,-15+hy,o,0);catEyes(g,-5+lk,-15+hy,o,0);
  shapes(g,[[-13,-11+hy,2,1,PK],[-2,-11+hy,2,1,PK],[-7,-11+hy,1,1,'#e8869a']]);
  catMouth(g,-7,-10+hy,o);
  if(o.paw==='up')shapes(g,[[-16,-15,4,4,B]],K);
  g.restore();
}
/* sitting cat for the title, the dance and the photo */
function drawBarney(g,x,y,s,o){blit(g,x,y-(o.jump||0),s,(b,bx,by)=>drawBarneyRaw(b,bx,by,o));}
function drawBarneyRaw(g,x,y,o){
  g.save();g.translate(x,y);
  if(o.stand){
    /* a kitten on little legs, with the same head as the sitting Barney */
    const {B,PK}=BAR,L='#b4b6c2',t=o.t||0,tw=Math.round(Math.sin(t*(o.purr?9:2)));
    shapes(g,[[-5,-5,3,5,B],[1,-5,3,5,B],[5,-8,3,2,B],[7+tw,-12,2,5,B],[-6,-17,11,13,B],
      [-8,-30,2,2,B],[5,-30,2,2,B],[-8,-28,4,2,B],[3,-28,4,2,B],[-8,-26,15,9,B]],K);
    shapes(g,[[-7,-27,1,1,PK],[5,-27,1,1,PK],[-4,-12,7,6,'#a0a2ae']]);
    catEyes(g,-6,-24,o,0);catEyes(g,2,-24,o,0);
    shapes(g,[[-8,-20,2,1,PK],[5,-20,2,1,PK],[-11,-21,2,1,K],[-11,-19,2,1,K],[8,-21,2,1,K],[8,-19,2,1,K]]);
    catMouth(g,0,-20,o);
    const upL=o.paw==='up',upR=o.paw==='upR';
    const aL=upL?[-11,-24,3,7]:[-9,-15,3,7],aR=upR?[7,-24,3,7]:[5,-15,3,7];
    shapes(g,[[...aL,B],[...aR,B]],K);
    shapes(g,[[aL[0],upL?aL[1]:aL[1]+5,3,2,L],[aR[0],upR?aR[1]:aR[1]+5,3,2,L]]);
    /* a little flower in the right paw */
    const fx=aR[0]+1,fy=upR?aR[1]:aR[1]+5;
    R(fx,fy-5,1,5,'#3e8a3a',g);R(fx+1,fy-3,2,1,'#4fa84a',g);
    shapes(g,[[fx-1,fy-8,3,3,'#ff7eb6']],K);R(fx,fy-7,1,1,'#ffd65a',g);
    g.restore();return;
  }
  const {B,D,PK}=BAR,t=o.t||0,tw=Math.round(Math.sin(t*(o.purr?9:2))),lk=Math.round(o.look||0),hy=o.headDown?1:0;
  shapes(g,[[-8,-25+hy,2,2,B],[5,-25+hy,2,2,B],[-8,-23+hy,4,2,B],[3,-23+hy,4,2,B],[-8,-21+hy,15,8,B],[-9,-13,17,11,B],[-8,-2,15,2,B],
    [8,-4,4,2,B],[11+tw,-9,2,6,B]],K);
  shapes(g,[[-7,-22,1,1,PK],[5,-22,1,1,PK],[-5,-11,9,6,'#a0a2ae']]);
  /* front paws are drawn inside the body with 1px lines (same width as the outline);
     a raised paw sticks out and gets its own outline */
  const L='#b4b6c2';
  /* round cat paws with little toes, not hooves */
  const front=[[-7,-2,5,2],[1,-2,5,2]];
  if(o.paw==='left'||o.paw==='up')front[0]=null;
  if(o.paw==='upR')front[1]=null;
  front.forEach(f=>{if(!f)return;const [px,py,pw,ph]=f;
    R(px,py,pw,ph,'#a4a6b2',g);R(px+1,py-1,pw-2,1,K,g);R(px,py,1,1,K,g);R(px+pw-1,py,1,1,K,g);
    R(px+1,py+ph-1,1,1,K,g);R(px+3,py+ph-1,1,1,K,g);});
  const raised=o.paw==='left'?[-16,-8,9,4]:o.paw==='up'?[-12,-19,4,8]:o.paw==='upR'?[8,-19,4,8]:null;
  if(raised){shapes(g,[[...raised,B]],K);const [px,py,pw,ph]=raised;
    if(pw>ph){R(px,py,3,ph,'#a4a6b2',g);R(px,py,1,1,K,g);R(px,py+ph-1,1,1,K,g);R(px+1,py+1,1,1,K,g);}
    else{R(px,py,pw,3,'#a4a6b2',g);R(px,py,1,1,K,g);R(px+pw-1,py,1,1,K,g);R(px+1,py+1,1,1,K,g);R(px+pw-2,py+1,1,1,K,g);}}
  catEyes(g,-6,-20+hy,o,lk);catEyes(g,2,-20+hy,o,lk);
  shapes(g,[[-8,-16,2,1,PK],[5,-16,2,1,PK],[-11,-17,2,1,K],[-11,-15,2,1,K],[8,-17,2,1,K],[8,-15,2,1,K]]);
  catMouth(g,0,-16,o);
  if(o.blep)R(0,-14,1,1,'#f08aa0',g);
  g.restore();

/* paint(g,t) draws an animated pixel picture on a 160x112 polaroid */
function card({kicker='',title,text='',paint,html='',btn='Дальше',onNext}){
  const ov=$('#ov'),c=$('#card');
  c.innerHTML=(kicker?`<p class="kicker">${kicker}</p>`:'')+`<h2>${title}</h2>`+(paint?'<canvas class="ph"></canvas>':'')+`<p class="wish"></p>${html}<button class="px" id="card-btn">${btn}</button>`;
  ov.hidden=false;
  const ph=c.querySelector('canvas.ph');
  if(ph){
    ph.width=160;ph.height=112;const g=ph.getContext('2d'),t0=performance.now();
    const tick=now=>{if(!ph.isConnected||ov.hidden)return;g.imageSmoothingEnabled=false;g.clearRect(0,0,160,112);paint(g,REDUCED?0:(now-t0)/1000);requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  }
  typeText(c.querySelector('.wish'),text);

/* Level 6: everyone dances, Ira snaps them on a lilac instax */
/* everyone has their own dance */
/* whole-number scales keep eyes and outlines crisp while everyone moves */
const CREW6=[
  {k:'masha',x:16,y:150,s:1,d:'jump'},{k:'deni',x:44,y:150,s:1,d:'sway'},{k:'pasha',x:72,y:150,s:1,d:'spin'},
  {k:'lyuba',x:108,y:150,s:1,d:'hair'},{k:'danil',x:136,y:150,s:1,d:'squat'},{k:'liza',x:164,y:150,s:1,d:'star'},
  {k:'vika',x:20,y:206,s:1,d:'wave'},{k:'vlad',x:50,y:206,s:1,d:'bounce'},{k:'ilya',x:130,y:206,s:1,d:'robot'},{k:'barney',x:160,y:208,s:1,d:'cat'}
];
function dance(st,t,i){
  switch(st){
    case 'jump':return{dy:Math.abs(Math.sin(t*6))*8,armsUp:Math.sin(t*12)>0};
    case 'star':return{dy:Math.abs(Math.sin(t*7))*12,armsUp:Math.sin(t*7)>0,step:Math.sin(t*7)>0?1:0};
    case 'sway':return{dx:Math.sin(t*3)*3,step:Math.sin(t*3)>0?1:-1};
    case 'spin':return{flip:Math.floor(t*3)%2===1,dy:Math.abs(Math.sin(t*6))*3,arm:Math.floor(t*3)%2?'L':'R'};
    case 'wave':return{arm:'R',dx:Math.round(Math.sin(t*10)),dy:0};
    case 'squat':return{dy:Math.sin(t*5)>0?-3:0,armsUp:Math.sin(t*5)>0};
    case 'robot':return{dx:Math.floor(t*2)%2?2:-2,arm:['L','','R',''][Math.floor(t*4)%4]};
    case 'hair':return{dx:Math.sin(t*4)*2,arm:Math.floor(t*2)%2?'L':'R'};
    case 'bounce':return{dy:Math.abs(Math.sin(t*9))*3,arm:'L'};
    case 'cat':return{dy:Math.abs(Math.sin(t*6))*5,arm:Math.floor(t*3)%2?'L':'R'};
  }
  return{};
}
/* party lights: a mirror ball with sweeping coloured beams and blinking spots on the deck */
function disco(t,g=ctx){
  const cols=['#ff7eb6','#c2e44a','#7ad8ff','#ffd65a','#c6a0f4'],bx=90,by=26;
  for(let i=0;i<5;i++){const a=Math.PI/2+Math.sin(t*1.3+i*1.7)*.9,len=230;
    g.globalAlpha=.13+.07*Math.sin(t*6+i);g.fillStyle=cols[i];g.beginPath();g.moveTo(bx,by);
    g.lineTo(bx+Math.cos(a-.09)*len,by+Math.sin(a-.09)*len);g.lineTo(bx+Math.cos(a+.09)*len,by+Math.sin(a+.09)*len);g.closePath();g.fill();}
  for(let i=0;i<8;i++){if(Math.sin(t*5+i*2.3)<.2)continue;g.globalAlpha=.3;ell(g,(i*47+Math.floor(t*2)*13)%W,140+(i*29)%90,8,3,cols[i%5]);}
  g.globalAlpha=1;R(bx,12,1,8,'#8a8a94',g);ell(g,bx,by,6,6,'#c8ccd8');for(let i=0;i<6;i++)R(bx-5+((i*3+Math.floor(t*8))%10),by-4+(i*3)%8,2,2,(i+Math.floor(t*8))%2?'#ffffff':'#8a8ea0',g);
}
const POSE_CYC=3.2,POSE_AT=2.1;

/* the instax shot itself: everyone posing, developing from dark */
function paintGroup(g,ox,oy,w,h,t,dev){
  g.save();g.beginPath();g.rect(ox,oy,w,h);g.clip();
  ['#3a2258','#4a2a60','#5a3268','#6a3a70'].forEach((c,i)=>R(ox,oy+Math.round(i*h/4),w,Math.ceil(h/4)+1,c,g));
  for(let i=0;i<9;i++)R(ox+Math.round((i+.5)*w/9),oy+3+(i%2)*2,2,2,CONF[i%5],g);
  R(ox,oy+Math.round(h*.8),w,h,'#5a3a4a',g);
  const s=h/150,back=['masha','deni','pasha','lyuba','danil','liza'];
  back.forEach((k,i)=>{const x=Math.round(ox+w*(i+.5)/6),y=Math.round(oy+h*.62);drawAny(g,k,x,y,1,{armsUp:true,smile:true});holdCocktail(g,k,x,y,1,{armsUp:true},i);});
  [['vika',.12],['vlad',.3],['ilya',.72]].forEach(([k,fx],i)=>{const x=Math.round(ox+w*fx),y=Math.round(oy+h*.9);drawAny(g,k,x,y,1,{armsUp:true,smile:true});holdCocktail(g,k,x,y,1,{armsUp:true},i+2);});
  drawBarney(g,Math.round(ox+w*.9),Math.round(oy+h*.97),1,{stand:true,t,happy:true});
  {const x=Math.round(ox+w*.5),y=Math.round(oy+h*.99);drawPer(g,'iraG',x,y,1,{armsUp:true,smile:true});holdCocktail(g,'iraG',x,y,1,{armsUp:true},0);}
  if(dev<1)R(ox,oy,w,h,`rgba(36,24,48,${(1-dev).toFixed(2)})`,g);
  g.restore();
}

/* ---------- loop & input ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  /* one bad frame must never freeze the whole game */
  try{if(scene){scene.update(dt);ctx.imageSmoothingEnabled=false;scene.draw();}}catch(e){console.error(e);}
  requestAnimationFrame(loop);
}
function toCanvas(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
['down','move','up'].forEach(ty=>cv.addEventListener('pointer'+ty,e=>{const[x,y]=toCanvas(e);scene&&scene.onPointer&&scene.onPointer(ty,x,y);}));
$('#deck').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&scene&&scene.onDeck)scene.onDeck(b.dataset.a);});
addEventListener('keydown',e=>{
  if(scene&&scene.onKey&&$('#ov').hidden){scene.onKey(e.key);if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();}
});
/* phones: no double-tap or pinch zoom while playing */
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
let lastTouch=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<350&&e.target.closest('#app')&&!e.target.closest('button'))e.preventDefault();lastTouch=now;},{passive:false});

buildSprites();setScene(titleScene);requestAnimationFrame(loop);
</script>
